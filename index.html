<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRON LOG — トレーニング記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
</head>
<style>
  :root{
    --bg:#111217;
    --surface:#1B1D24;
    --surface-2:#242730;
    --surface-3:#2E313C;
    --accent:#FF5A36;
    --accent-dim:#4A2A20;
    --accent-2:#FFC93D;
    --text:#F2F1EC;
    --text-dim:#8B90A0;
    --line:#33363F;
    --danger:#FF5A5A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0A0A0D;height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  #phone{
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,90,54,0.07), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(255,201,61,0.05), transparent 45%);
  }
  .display-font{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'DM Mono',monospace;}

  /* ---------- Header ---------- */
  #app-header{
    padding: calc(18px + var(--safe-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  #app-header .title-block{display:flex; align-items:baseline; gap:8px;}
  #app-header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px; margin:0; letter-spacing:0.04em; line-height:1;
  }
  #app-header .plate-mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--text); cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-3);}

  /* ---------- Scroll body ---------- */
  #view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding: 0 20px calc(24px + var(--safe-bottom));
  }
  #view::-webkit-scrollbar{width:0px;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;}
  .cal-nav .month-label{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.03em; color:var(--text);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--text-dim); padding-bottom:6px; font-weight:600;}
  .cal-cell{
    aspect-ratio:1/1;
    border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    background:var(--surface);
    border:1px solid transparent;
    cursor:pointer;
  }
  .cal-cell.empty{background:transparent; cursor:default;}
  .cal-cell .d{font-size:14px; font-weight:600; color:var(--text-dim);}
  .cal-cell.has-log .d{color:var(--text);}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.today .d{color:var(--accent-2);}
  .cal-cell .plates{position:absolute; bottom:6px; display:flex; gap:2px;}
  .cal-cell .plate-dot{width:5px;height:5px;border-radius:50%; background:var(--accent);}
  .cal-cell:active{background:var(--surface-2);}

  .empty-hint{
    margin-top:28px; padding:22px 18px; border-radius:18px;
    background:var(--surface); border:1px dashed var(--line);
    color:var(--text-dim); font-size:13.5px; line-height:1.7; text-align:center;
  }
  .section-label{
    font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:0.08em;
    margin: 26px 2px 10px; text-transform:uppercase;
  }
  .recent-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border-radius:16px; padding:12px 14px; margin-bottom:8px;
    border:1px solid var(--line);
  }
  .recent-item .ic{width:36px;height:36px;flex-shrink:0;}
  .recent-item .info{flex:1; min-width:0;}
  .recent-item .date{font-size:11px; color:var(--text-dim); font-weight:600;}
  .recent-item .name{font-size:14.5px; font-weight:700;}
  .recent-item .count{font-size:12px; color:var(--accent-2); font-weight:600; font-family:'DM Mono',monospace;}

  /* ---------- Grid tiles (body parts / exercises) ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .tile{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
  }
  .tile:active{background:var(--surface-2); transform:scale(0.98);}
  .tile .ic{width:44px;height:44px;}
  .tile .label{font-size:15px; font-weight:700;}
  .tile .sub{font-size:11px; color:var(--text-dim);}

  .ex-tile{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer; margin-bottom:10px;
  }
  .ex-tile:active{background:var(--surface-2);}
  .ex-tile .ic-wrap{
    width:46px;height:46px;border-radius:12px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
    border:1px solid var(--line);
  }
  .ex-tile .ic{width:26px;height:26px;}
  .ex-tile .name{font-size:15px; font-weight:700; flex:1;}
  .ex-tile .equip{font-size:10.5px; color:var(--text-dim); font-weight:600; letter-spacing:0.03em;}
  .ex-tile .chev{color:var(--text-dim);}

  /* ---------- Back / top row for sub views ---------- */
  .subview-top{display:flex; align-items:center; gap:12px; margin:4px 0 4px;}
  .subview-top .crumb{font-size:12px; color:var(--text-dim); font-weight:600;}
  .subview-title{font-family:'Bebas Neue',sans-serif; font-size:26px; margin:6px 0 16px; letter-spacing:0.03em;}

  /* ---------- Sets screen ---------- */
  .ex-hero{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--surface-2), var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:18px;
  }
  .ex-hero .ic-wrap{
    width:58px;height:58px;border-radius:16px;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .ex-hero .ic{width:32px;height:32px;}
  .ex-hero .name{font-size:19px; font-weight:800;}
  .ex-hero .part{font-size:12px; color:var(--accent-2); font-weight:600;}

  .set-row{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:8px;
  }
  .set-row .idx{
    width:26px;height:26px;border-radius:50%; background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;
  }
  .set-row .vals{flex:1; display:flex; gap:6px; font-family:'DM Mono',monospace; font-size:15px; font-weight:500;}
  .set-row .vals b{color:var(--accent-2); font-weight:600;}
  .set-row .del{color:var(--text-dim); cursor:pointer; padding:4px;}

  .add-set-row{display:flex; gap:10px; margin:14px 0;}
  .input-box{
    flex:1; background:var(--surface); border:1.5px dashed var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; text-align:center;
  }
  .input-box .lbl{font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:0.06em; text-transform:uppercase;}
  .input-box .val{font-family:'Bebas Neue',sans-serif; font-size:28px; margin-top:2px; color:var(--text);}
  .input-box.filled{border-style:solid; border-color:var(--accent);}
  .input-box.filled .val{color:var(--accent-2);}

  .primary-btn{
    width:100%; padding:16px; border-radius:16px; border:none;
    background:var(--accent); color:#1a0d08; font-weight:800; font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .primary-btn:active{background:#e04c2b;}
  .primary-btn:disabled{background:var(--surface-3); color:var(--text-dim);}
  .ghost-btn{
    width:100%; padding:15px; border-radius:16px; border:1px solid var(--line);
    background:transparent; color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
    margin-top:10px;
  }
  .ghost-btn:active{background:var(--surface-2);}

  /* ---------- Session floating bar ---------- */
  #session-bar{
    position:absolute; left:16px; right:16px; bottom:calc(16px + var(--safe-bottom));
    background:var(--surface-3); border:1px solid var(--accent);
    border-radius:18px; padding:12px 16px;
    display:none; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    z-index:40;
  }
  #session-bar.show{display:flex;}
  #session-bar .left{display:flex; align-items:center; gap:10px;}
  #session-bar .count{
    width:30px;height:30px;border-radius:50%; background:var(--accent); color:#1a0d08;
    display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  }
  #session-bar .txt{font-size:13px; font-weight:700;}
  #session-bar .save-mini{
    background:var(--accent-2); color:#1a0d08; border:none; border-radius:12px;
    padding:9px 16px; font-weight:800; font-size:13px; cursor:pointer;
  }

  /* ---------- FAB ---------- */
  #fab-group{
    position:absolute; right:18px; bottom:calc(18px + var(--safe-bottom));
    display:flex; align-items:center; gap:10px; z-index:30;
  }
  #fab-label{
    background:var(--surface-3); border:1px solid var(--line);
    color:var(--text); font-size:13px; font-weight:700;
    padding:10px 14px; border-radius:14px; white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  #fab{
    width:58px;height:58px; border-radius:50%; flex-shrink:0;
    background:var(--accent); border:none; color:#1a0d08;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(255,90,54,0.4);
    cursor:pointer;
  }
  #fab:active{transform:scale(0.94);}
  #fab svg{width:26px;height:26px;}

  /* ---------- Keypad modal ---------- */
  #keypad-overlay, #addex-overlay{
    position:absolute; inset:0; background:rgba(8,8,10,0.72);
    display:none; align-items:flex-end; z-index:100;
    backdrop-filter:blur(2px);
  }
  #keypad-overlay.show, #addex-overlay.show{display:flex;}
  #keypad-sheet, #addex-sheet{
    width:100%; background:var(--surface); border-radius:26px 26px 0 0;
    padding:20px 20px calc(20px + var(--safe-bottom));
    border-top:1px solid var(--line);
    animation:slideup 0.18s ease-out;
    max-height:82%; overflow-y:auto;
  }
  #addex-sheet h2{font-family:'Bebas Neue',sans-serif; font-size:22px; margin:0 0 16px; letter-spacing:0.03em;}
  .field-label{font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; margin:0 2px 8px;}
  .text-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:14px; font-size:15px; color:var(--text); font-family:'Inter',sans-serif; margin-bottom:18px;
  }
  .text-input:focus{outline:none; border-color:var(--accent);}
  .equip-opt{padding:14px 10px;}
  .equip-opt .ic{width:32px;height:32px;}
  .equip-opt.selected{border-color:var(--accent); background:var(--surface-2);}
  .equip-opt.selected .label{color:var(--accent-2);}
  .add-ex-tile{
    background:var(--surface); border:1px dashed var(--line); border-radius:18px;
    padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:10px; margin-top:4px;
    color:var(--text-dim);
  }
  .add-ex-tile:active{background:var(--surface-2);}
  .add-ex-tile .ic-wrap{
    width:46px;height:46px;border-radius:12px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; flex-shrink:0; border:1px dashed var(--line);
  }
  .add-ex-tile .name{font-size:14.5px; font-weight:700; color:var(--text);}
  .add-ex-tile .sub2{font-size:11px; color:var(--text-dim);}
  @keyframes slideup{from{transform:translateY(30px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  #keypad-sheet .kp-label{font-size:12px; color:var(--text-dim); font-weight:700; text-align:center; letter-spacing:0.06em;}
  #keypad-sheet .kp-display{
    font-family:'Bebas Neue',sans-serif; font-size:52px; text-align:center; margin:6px 0 18px; color:var(--accent-2);
    min-height:60px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  #keypad-sheet .kp-display .unit{font-family:'Inter',sans-serif; font-size:16px; color:var(--text-dim); font-weight:600;}
  .kp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .kp-key{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:18px 0; text-align:center; font-size:22px; font-weight:600;
    cursor:pointer; user-select:none; color:var(--text);
  }
  .kp-key:active{background:var(--surface-3);}
  .kp-key.func{color:var(--text-dim); font-size:15px; font-weight:700;}
  .kp-key.confirm{background:var(--accent); color:#1a0d08; font-weight:800;}
  .kp-key.confirm:active{background:#e04c2b;}
  .quick-vals{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;}
  .quick-vals .qv{
    flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:8px 14px; font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; font-family:'DM Mono',monospace;
  }
  .quick-vals .qv:active{background:var(--surface-3); color:var(--text);}

  /* ---------- Day detail sheet ---------- */
  #day-overlay{
    position:absolute; inset:0; background:rgba(8,8,10,0.72); display:none;
    align-items:flex-end; z-index:90;
  }
  #day-overlay.show{display:flex;}
  #day-sheet{
    width:100%; max-height:78%; overflow-y:auto;
    background:var(--surface); border-radius:26px 26px 0 0;
    padding:22px 20px calc(24px + var(--safe-bottom));
    border-top:1px solid var(--line);
    animation:slideup 0.18s ease-out;
  }
  #day-sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--line); margin:0 auto 16px;}
  #day-sheet h2{font-family:'Bebas Neue',sans-serif; font-size:24px; margin:0 0 16px; letter-spacing:0.03em;}
  .day-ex-block{background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;}
  .day-ex-block .hd{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .day-ex-block .ic-wrap{width:36px;height:36px;border-radius:10px;background:var(--surface-3); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .day-ex-block .ic{width:20px;height:20px;}
  .day-ex-block .name{font-size:14.5px; font-weight:700; flex:1;}
  .day-ex-block .del{color:var(--text-dim); cursor:pointer; padding:4px;}
  .day-sets-line{font-family:'DM Mono',monospace; font-size:13px; color:var(--text-dim); display:flex; flex-wrap:wrap; gap:6px;}
  .day-sets-line span{background:var(--surface-3); border-radius:8px; padding:4px 8px; color:var(--text);}

  .toast{
    position:absolute; top:calc(14px + var(--safe-top)); left:50%; transform:translateX(-50%);
    background:var(--accent-2); color:#1a0d08; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:14px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity 0.2s, transform 0.2s;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}
</style>
</head>
<body>
<div id="phone">
  <div id="app-header">
    <div class="title-block">
      <div class="plate-mark"></div>
      <h1>IRON LOG</h1>
    </div>
    <div class="icon-btn" id="today-btn" title="今日へ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>

  <div id="view"></div>

  <div id="session-bar">
    <div class="left">
      <div class="count" id="session-count">0</div>
      <div class="txt">今日の記録に追加済み</div>
    </div>
    <button class="save-mini" id="session-save-btn">カレンダーに記録する</button>
  </div>

  <div id="fab-group">
    <div id="fab-label">トレーニングを記録</div>
    <button id="fab" title="トレーニングを記録">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="keypad-overlay">
    <div id="keypad-sheet"></div>
  </div>

  <div id="day-overlay">
    <div id="day-sheet"></div>
  </div>

  <div id="addex-overlay">
    <div id="addex-sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){

/* ============================= DATA ============================= */

const ICONS = {
  barbell: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="24" x2="42" y2="24"/>
    <rect x="3" y="15" width="6" height="18" rx="1.5"/>
    <rect x="9" y="18" width="4" height="12" rx="1.2"/>
    <rect x="39" y="15" width="6" height="18" rx="1.5"/>
    <rect x="35" y="18" width="4" height="12" rx="1.2"/>
  </svg>`,
  dumbbell: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="24" x2="32" y2="24"/>
    <circle cx="10" cy="24" r="7.5"/>
    <circle cx="38" cy="24" r="7.5"/>
  </svg>`,
  cable: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="9" r="4"/>
    <line x1="24" y1="13" x2="24" y2="30"/>
    <path d="M14 30 L34 30 L30 40 L18 40 Z"/>
  </svg>`,
  bodyweight: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="9" r="4.5"/>
    <line x1="24" y1="14" x2="24" y2="28"/>
    <line x1="24" y1="18" x2="13" y2="24"/>
    <line x1="24" y1="18" x2="35" y2="24"/>
    <line x1="24" y1="28" x2="15" y2="42"/>
    <line x1="24" y1="28" x2="33" y2="42"/>
  </svg>`,
  chest: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 22 C6 12 14 8 24 8 C34 8 42 12 42 22"/>
    <path d="M24 8 L24 26"/>
    <path d="M10 22 C10 27 16 30 20 27"/>
    <path d="M38 22 C38 27 32 30 28 27"/>
    <line x1="4" y1="16" x2="12" y2="16"/>
    <line x1="36" y1="16" x2="44" y2="16"/>
  </svg>`,
  back: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6 L10 16 L14 42 L24 34 L34 42 L38 16 Z"/>
    <line x1="24" y1="6" x2="24" y2="34"/>
  </svg>`,
  legs: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 L16 26 L11 42"/>
    <path d="M30 6 L32 26 L37 42"/>
    <line x1="16" y1="6" x2="32" y2="6"/>

/* ============================= STATE ============================= */

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  return y+'年 '+m+'月'+d+'日';
}

const state = {
  view: 'calendar',
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  logDates: new Set(),      // dates (YYYY-MM-DD) that have logs, loaded from index
  recentDays: [],           // for the "最近の記録" preview list on home
  bodyPart: null,
  exercise: null,
  currentSets: [],          // sets being built for current exercise
  session: [],              // exercises added this session: {bodyPartId, bodyPartLabel, exerciseId, name, icon, equip, sets:[]}
  dayDetailDate: null,
  dayDetailEntries: null,
  loading: true,
  customExercises: {},      // {bodyPartId: [{id,name,equip,equipLabel,custom:true}]}
};

/* ============================= STORAGE ============================= */

async function loadIndex(){
  try{
    const res = await window.storage.get('dates-index', false);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(arr){
  try{ await window.storage.set('dates-index', JSON.stringify(arr), false); }catch(e){}
}
async function loadDayLog(dateStr){
  try{
    const res = await window.storage.get('log:'+dateStr, false);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveDayLog(dateStr, entries){
  try{ await window.storage.set('log:'+dateStr, JSON.stringify(entries), false); return true; }
  catch(e){ return false; }
}
async function deleteDayLog(dateStr){
  try{ await window.storage.delete('log:'+dateStr, false); }catch(e){}
}
async function loadCustomExercises(){
  try{
    const res = await window.storage.get('custom-exercises', false);
    return res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ return {}; }
}
async function saveCustomExercises(obj){
  try{ await window.storage.set('custom-exercises', JSON.stringify(obj), false); return true; }
  catch(e){ return false; }
}
function getExercisesForBodyPart(bpId){
  return (EXERCISES[bpId]||[]).concat(state.customExercises[bpId]||[]);
}

async function refreshIndexAndRecents(){
  const dates = await loadIndex();
  state.logDates = new Set(dates);
  const sorted = dates.slice().sort().reverse().slice(0,4);
  const recents = [];
  for(const d of sorted){
    const entries = await loadDayLog(d);
    if(entries && entries.length){
      recents.push({date:d, entries});
    }
  }
  state.recentDays = recents;
}

/* ============================= VIEW: CALENDAR ============================= */

function renderCalendar(){
  document.getElementById('fab-group').style.display = 'flex';
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const has = state.logDates.has(dstr);
    const isToday = dstr === today;
    cells += `<div class="cal-cell ${has?'has-log':''} ${isToday?'today':''}" data-date="${dstr}">
      <div class="d">${d}</div>
      ${has?'<div class="plates"><div class="plate-dot"></div></div>':''}
    </div>`;
  }

  let recentHtml = '';
  if(state.recentDays.length){
    recentHtml += `<div class="section-label">最近の記録</div>`;
    for(const day of state.recentDays){
      for(const ent of day.entries.slice(0,3)){
        recentHtml += `<div class="recent-item" data-date="${day.date}">
          <div class="ic-wrap" style="width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line);">
            ${icon(ent.equip,'ic')}
          </div>
          <div class="info">
            <div class="date">${fmtDate(day.date)}</div>
            <div class="name">${ent.name}</div>
          </div>
          <div class="count">${ent.sets.length}セット</div>
        </div>`;
      }
    }
  } else if(!state.loading) {
    recentHtml = `<div class="empty-hint">まだ記録がありません。<br>右下の「＋」から今日のトレーニングを記録しましょう。</div>`;
  }

  $view.innerHTML = `
    <div class="cal-nav">
      <div class="icon-btn" id="prev-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="month-label">${y}年 ${MONTH_NAMES[m]}</div>
      <div class="icon-btn" id="next-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${recentHtml}
  `;

  document.getElementById('prev-month').onclick = ()=>{
    state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;}
    render();
  };
  document.getElementById('next-month').onclick = ()=>{
    state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;}
    render();
  };
  $view.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    el.onclick = ()=>openDayDetail(el.dataset.date);
  });
  $view.querySelectorAll('.recent-item[data-date]').forEach(el=>{
    el.onclick = ()=>openDayDetail(el.dataset.date);
  });
}

        <div class="part">${ex.equipLabel}</div>
      </div>

    <div class="add-set-row">
      <div class="input-box ${pendingSet.weight!==null?'filled':''}" id="weight-box">
        <div class="lbl">重量 (kg)</div>
        <div class="val">${pendingSet.weight!==null?pendingSet.weight:'―'}</div>
      </div>
      <div class="input-box ${pendingSet.reps!==null?'filled':''}" id="reps-box">
        <div class="lbl">回数 (reps)</div>
        <div class="val">${pendingSet.reps!==null?pendingSet.reps:'―'}</div>
      </div>
    </div>
    <button class="primary-btn" id="add-set-btn" ${(pendingSet.weight===null||pendingSet.reps===null)?'disabled':''}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

    <button class="ghost-btn" id="finish-ex-btn" ${state.currentSets.length===0?'disabled':''}>

  document.getElementById('back-btn').onclick = ()=>{ state.view='exercise'; state.currentSets=[]; pendingSet={weight:null,reps:null}; render(); };

  document.getElementById('weight-box').onclick = ()=>openKeypad({
    label:'重量を入力', unit:'kg', decimal:true, initial: pendingSet.weight,
    onConfirm:(v)=>{ pendingSet.weight = v; render(); }
  });
  document.getElementById('reps-box').onclick = ()=>openKeypad({
    label:'回数を入力', unit:'reps', decimal:false, initial: pendingSet.reps,
    onConfirm:(v)=>{ pendingSet.reps = v; render(); }
  });

  const addBtn = document.getElementById('add-set-btn');
  if(addBtn){
    addBtn.onclick = ()=>{
      if(pendingSet.weight===null||pendingSet.reps===null) return;
      state.currentSets.push({weight:pendingSet.weight, reps:pendingSet.reps});
      pendingSet = {weight:null, reps:null};
      render();
    };
  }
  $view.querySelectorAll('.set-row .del').forEach(el=>{
    el.onclick = ()=>{ state.currentSets.splice(Number(el.dataset.i),1); render(); };
  });

  const finishBtn = document.getElementById('finish-ex-btn');
  if(finishBtn){
    finishBtn.onclick = ()=>{
      if(!state.currentSets.length) return;
      state.session.push({
        bodyPartId: bp.id, bodyPartLabel: bp.label,
        exerciseId: ex.id, name: ex.name, equip: ex.equip, equipLabel: ex.equipLabel,
        sets: state.currentSets.slice(),
      });
      state.currentSets = [];
      pendingSet = {weight:null, reps:null};
      state.view = 'bodypart';
      render();
      showToast(ex.name + ' を追加しました');
    };
  }
}

const $kpOverlay = document.getElementById('keypad-overlay');
const $kpSheet = document.getElementById('keypad-sheet');
let kpState = null;

function openKeypad({label, unit, decimal, initial, onConfirm}){
  kpState = { value: initial!==null && initial!==undefined ? String(initial) : '', decimal, onConfirm, unit };
  renderKeypad(label, unit);
  $kpOverlay.classList.add('show');
}
function closeKeypad(){
  $kpOverlay.classList.remove('show');
  kpState = null;
}

function renderKeypad(label, unit){
  const quick = unit==='kg' ? [10,20,30,40,50,60] : [5,8,10,12,15,20];
  $kpSheet.innerHTML = `
    <div class="kp-label">${label}</div>
    <div class="kp-display"><span id="kp-val">${kpState.value || '0'}</span><span class="unit">${unit}</span></div>
    <div class="quick-vals">
      ${quick.map(q=>`<div class="qv" data-q="${q}">${q}</div>`).join('')}
    </div>
    <div class="kp-grid">
      <div class="kp-key" data-k="1">1</div><div class="kp-key" data-k="2">2</div><div class="kp-key" data-k="3">3</div>
      <div class="kp-key" data-k="4">4</div><div class="kp-key" data-k="5">5</div><div class="kp-key" data-k="6">6</div>
      <div class="kp-key" data-k="7">7</div><div class="kp-key" data-k="8">8</div><div class="kp-key" data-k="9">9</div>
      <div class="kp-key func" data-k="${kpState.decimal?'.':'clear'}">${kpState.decimal?'.':'C'}</div>
      <div class="kp-key" data-k="0">0</div>
      <div class="kp-key func" data-k="back">⌫</div>
    </div>
    <button class="primary-btn" id="kp-confirm" style="margin-top:12px;">決定</button>
  `;
  $kpSheet.querySelectorAll('.kp-key[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k;
      if(k==='back'){ kpState.value = kpState.value.slice(0,-1); }
      else if(k==='clear'){ kpState.value=''; }
      else if(k==='.'){ if(!kpState.value.includes('.')) kpState.value += (kpState.value===''?'0.':'.'); }
      else {
        if(kpState.value.length < 6) kpState.value += k;
      }
      document.getElementById('kp-val').textContent = kpState.value || '0';
    };
  });
  $kpSheet.querySelectorAll('.qv[data-q]').forEach(el=>{
    el.onclick = ()=>{ kpState.value = el.dataset.q; document.getElementById('kp-val').textContent = kpState.value; };
  });
  document.getElementById('kp-confirm').onclick = ()=>{
    const num = parseFloat(kpState.value);
    if(isNaN(num) || num <= 0){ showToast('数値を入力してください'); return; }
    const cb = kpState.onConfirm;
    closeKeypad();
    cb(num);
  };
}
$kpOverlay.addEventListener('click', (e)=>{ if(e.target===$kpOverlay) closeKeypad(); });

/* ============================= ADD CUSTOM EXERCISE ============================= */

const $addexOverlay = document.getElementById('addex-overlay');
const $addexSheet = document.getElementById('addex-sheet');
const EQUIP_OPTIONS = [
  { equip:'barbell', label:'バーベル' },
  { equip:'dumbbell', label:'ダンベル' },
  { equip:'cable', label:'マシン・ケーブル' },
  { equip:'bodyweight', label:'自重' },
  { equip:'custom', label:'その他（自分で入力）' },
];

function openAddExerciseModal(bp){
  let selectedEquip = null;
  $addexSheet.innerHTML = `
    <div class="handle"></div>
    <h2>種目を追加（${bp.label}）</h2>
    <div class="field-label">種目名</div>
    <input type="text" id="new-ex-name" class="text-input" placeholder="例：ケーブルフライ" maxlength="20">
    <div class="field-label">器具タイプ</div>
    <div class="grid-2" id="equip-select" style="margin-bottom:12px;">
      ${EQUIP_OPTIONS.map(o=>`
        <div class="tile equip-opt" data-equip="${o.equip}" data-label="${o.label}" ${o.equip==='custom'?'style="grid-column:1 / -1;"':''}>
          ${icon(o.equip,'ic')}
          <div class="label" style="font-size:13px; text-align:center;">${o.label}</div>
        </div>
      `).join('')}
    </div>
    <div id="custom-equip-wrap" style="display:none;">
      <div class="field-label">器具タイプ名</div>
      <input type="text" id="custom-equip-name" class="text-input" placeholder="例：チューブ、EZバーなど" maxlength="14">
    </div>
    <button class="primary-btn" id="confirm-add-ex" disabled>この種目を追加</button>
  `;
  $addexOverlay.classList.add('show');

  const $nameInput = document.getElementById('new-ex-name');
  const $confirmBtn = document.getElementById('confirm-add-ex');
  const $customWrap = document.getElementById('custom-equip-wrap');
  const $customName = document.getElementById('custom-equip-name');
  function checkReady(){
    const nameOk = $nameInput.value.trim().length > 0;
    const equipOk = selectedEquip && (selectedEquip.equip !== 'custom' || $customName.value.trim().length > 0);
    $confirmBtn.disabled = !(nameOk && equipOk);
  }
  $nameInput.addEventListener('input', checkReady);
  $customName.addEventListener('input', checkReady);
  $addexSheet.querySelectorAll('.equip-opt').forEach(el=>{
    el.onclick = ()=>{
      $addexSheet.querySelectorAll('.equip-opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      selectedEquip = { equip: el.dataset.equip, label: el.dataset.label };
      $customWrap.style.display = selectedEquip.equip === 'custom' ? 'block' : 'none';
      checkReady();
    };
  });
  $confirmBtn.onclick = async ()=>{
    const name = $nameInput.value.trim();
    if(!name || !selectedEquip) return;
    const equipLabel = selectedEquip.equip === 'custom' ? $customName.value.trim() : selectedEquip.label;
    if(!equipLabel) return;
    const newEx = {
      id: 'custom_' + Date.now(),
      name,
      equip: selectedEquip.equip,
      equipLabel,
      custom: true,
    };
    if(!state.customExercises[bp.id]) state.customExercises[bp.id] = [];
    state.customExercises[bp.id].push(newEx);
    await saveCustomExercises(state.customExercises);
    closeAddExerciseModal();
    state.exercise = newEx;
    state.currentSets = [];
    state.view = 'sets';
    render();
    showToast(name + ' を追加しました');
  };
}
function closeAddExerciseModal(){
  $addexOverlay.classList.remove('show');
}
$addexOverlay.addEventListener('click', (e)=>{ if(e.target===$addexOverlay) closeAddExerciseModal(); });

/* ============================= SESSION SAVE ============================= */

async function saveSession(){
  if(!state.session.length) return;
  const date = todayStr();
  const existing = await loadDayLog(date);
  const merged = existing.concat(state.session);
  const ok = await saveDayLog(date, merged);
  if(ok){
    const dates = await loadIndex();
    if(!dates.includes(date)){ dates.push(date); await saveIndex(dates); }
    state.session = [];
    state.view = 'calendar';
    await refreshIndexAndRecents();
    render();
    showToast('カレンダーに記録しました');
  } else {
    showToast('保存に失敗しました。もう一度お試しください');
  }
}

/* ============================= DAY DETAIL ============================= */

const $dayOverlay = document.getElementById('day-overlay');
const $daySheet = document.getElementById('day-sheet');

async function openDayDetail(dateStr){
  state.dayDetailDate = dateStr;
  const entries = await loadDayLog(dateStr);
  state.dayDetailEntries = entries;
  renderDayDetail();
  $dayOverlay.classList.add('show');
}
function closeDayDetail(){
  $dayOverlay.classList.remove('show');
}

function renderDayDetail(){
  const date = state.dayDetailDate;
  const entries = state.dayDetailEntries || [];
  $daySheet.innerHTML = `
    <div class="handle"></div>
    <h2>${fmtDate(date)}</h2>
    ${entries.length ? entries.map((ent,i)=>`
      <div class="day-ex-block">
        <div class="hd">
          <div class="ic-wrap">${icon(ent.equip,'ic')}</div>
          <div class="name">${ent.name}</div>
          <div class="del" data-i="${i}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div class="day-sets-line">
          ${ent.sets.map(s=>`<span>${s.weight}kg × ${s.reps}reps</span>`).join('')}
        </div>
      </div>
    `).join('') : `<div class="empty-hint">この日の記録はありません</div>`}
  `;
  $daySheet.querySelectorAll('.del[data-i]').forEach(el=>{
    el.onclick = async ()=>{
      const i = Number(el.dataset.i);
      state.dayDetailEntries.splice(i,1);
      if(state.dayDetailEntries.length){
        await saveDayLog(date, state.dayDetailEntries);
      } else {
        await deleteDayLog(date);
        const dates = await loadIndex();
        const idx = dates.indexOf(date);
        if(idx>-1){ dates.splice(idx,1); await saveIndex(dates); }
      }
      await refreshIndexAndRecents();
      renderDayDetail();
      renderCalendar();
    };
  });
}
$dayOverlay.addEventListener('click',(e)=>{ if(e.target===$dayOverlay) closeDayDetail(); });

/* ============================= MAIN RENDER SWITCH ============================= */

function render(){
  if(state.view==='calendar') renderCalendar();
  else if(state.view==='bodypart') renderBodyPartSelect();
  else if(state.view==='exercise') renderExerciseSelect();
  else if(state.view==='sets') renderSets();
  updateSessionBar();
}

document.getElementById('fab').onclick = ()=>{
  state.bodyPart = null; state.exercise = null; state.currentSets = [];
  state.view = 'bodypart';
  render();
};
document.getElementById('today-btn').onclick = ()=>{
  state.calMonth = new Date().getMonth();
  state.calYear = new Date().getFullYear();
  state.view = 'calendar';
  render();
};
document.getElementById('session-save-btn').onclick = saveSession;

/* ============================= INIT ============================= */

(async function init(){
  $view.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
  state.customExercises = await loadCustomExercises();
  await refreshIndexAndRecents();
  state.loading = false;
  render();
})();

})();
